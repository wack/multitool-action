name: Test MultiTool Action

on:
  push:
    branches-ignore:
      - trunk

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Test whether the Action installs correctly.
      - name: Install MultiTool via Action
        uses: "./"
        with:
          install-only: "true"
          version: "v0.6.0"

      - name: "Test CLI is installed"
        run: "which multi"

      - name: "Test CLI help works"
        run: "multi -h"

      - name: "Test the `check` subcommand is available"
        run: "multi check --help"

      - name: "Test CLI version matches"
        run: |
          if [ "$(multi version)" = "v0.6.0" ]; then
            echo "Version is correct."
          else
            echo "Version is incorrect."
            exit 1
          fi
